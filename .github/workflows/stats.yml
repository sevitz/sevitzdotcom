name: Refresh stats

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The approval config names private repos, so it lives in a private repo.
      - uses: actions/checkout@v7
        with:
          repository: sevitz/claude-library
          token: ${{ secrets.STATS_GITHUB_TOKEN }}
          path: .stats-config
          sparse-checkout: dev/stats
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build stats
        env:
          STATS_GITHUB_TOKEN: ${{ secrets.STATS_GITHUB_TOKEN }}
        run: node scripts/compute-stats.mjs --config .stats-config/dev/stats/repos.json

      # Only commit from master, and only when the numbers changed. The push triggers the Workers Builds deploy.
      - name: Commit if changed
        if: github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/stats.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Refresh GitHub stats"
          git pull --rebase origin master
          git push origin HEAD:master
